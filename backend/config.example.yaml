# AI Grammar Checker — Backend Configuration
#
# Copy this file to config.yaml and fill in your settings.
# config.yaml is gitignored.

# --- Server listen address ---
server:
  host: 127.0.0.1
  port: 8766

# Enable detailed debug logging to stderr (request/response timing, provider calls).
# Shows: incoming requests, AI provider calls, response sizes, error counts.
# Set to false for production.
debug: false

ai:
  # Model to use for grammar checking.
  # Smaller/faster models (gpt-4o-mini, claude-haiku, deepseek-chat) work well
  # and are much cheaper than flagship models for this task.
  model: gpt-4o-mini

  # --- Provider endpoint (protocol selection) ---
  # Only these three exact values are accepted:
  #   /v1/chat/completions  OpenAI Chat Completions (Authorization: Bearer)
  #   /v1/responses         OpenAI Responses       (Authorization: Bearer)
  #   /v1/messages          Anthropic Messages     (x-api-key)
  # Omitting this key keeps the legacy behavior: the base is normalized with
  # /v1 and the Chat Completions path is used.
  endpoint: /v1/chat/completions

  # API base URL (the gateway prefix; the endpoint path is appended to it).
  # Legacy mode (no `endpoint` key): /v1 is appended unless already present, and
  # the historical trailing-slash result is preserved.
  # Explicit mode: trailing slashes are trimmed from this base and the configured
  # endpoint is appended verbatim, so custom gateway prefixes are kept as-is.
  # Explicit mode also defaults this value to https://api.openai.com when omitted.
  # Examples:
  #   OpenAI:        https://api.openai.com
  #   Tencent TokenHub: https://tokenhub.tencentmaas.com
  #   chat2api:      http://127.0.0.1:8000
  #   DeepSeek:      https://api.deepseek.com
  api_base: https://api.openai.com

  # --- API Key ---
  # $ prefix: read from environment variable (recommended).
  # No prefix: inline key directly in this file.
  # Sent as `Authorization: Bearer <key>` for both OpenAI protocols, and as
  # `x-api-key: <key>` for /v1/messages (Messages has no Bearer auth).
  api_key: $OPENAI_API_KEY

  # Fallback max_tokens for /v1/messages when the caller sends no positive limit
  # (Messages requires max_tokens). Must be a positive integer; not used by the
  # OpenAI protocols, which simply omit the field when no caller limit is given.
  messages_default_max_tokens: 4096

  # --- Timeouts (all values in seconds) ---
  timeout:
    connect: 10     # TCP/TLS handshake
    read: 300        # Waiting for AI response (grammar checks are fast)
    write: 60        # Sending request body
    pool: 10         # Connection pool acquire

  # --- Temperature ---
  # Controls randomness in AI responses (0.0 = deterministic, 1.0 = most creative).
  # Defaults: check=0.1, polish=0.3, translate=0.3.
  # Set a global override for models that only accept a fixed temperature (e.g. 1):
  #   temperature: 1
  # Or set per-endpoint:
  #   endpoints:
  #     check: 0.0
  #     polish: 0.7
  #     translate: 0.5
